<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cross Broadway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1b1c1d;--sign:#1d6a43;--yellow:#ffd23f;--red:#d9412f;--paper:#f5efe2;--ink:#15171a;
  --font:"Overpass","Arial Narrow",Arial,Helvetica,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1c1d}}
:root[data-theme="dark"]{--bg:#1b1c1d}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;overflow:hidden;background:var(--bg);font-family:var(--font)}
body{height:100%}
button{font-family:var(--font)}
button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

#stage{position:relative;height:100%;overflow:hidden;background:#aaa592}
canvas{display:block;width:100%;height:100%;touch-action:none}

#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.pill{background:rgba(20,21,22,.72);color:#fff;border-radius:999px;padding:6px 12px 5px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:10px}
.dots{display:inline-flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:#fff}
.dots i.off{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6)}
#pauseBtn{pointer-events:auto;width:34px;height:34px;border-radius:50%;border:0;background:rgba(20,21,22,.72);color:#fff;font-weight:900;font-size:12px;cursor:pointer}
#hud.hidden{display:none}

#report{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(440px,calc(100% - 20px));
  background:var(--paper);color:var(--ink);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);overflow:hidden;display:none}
#report.show{display:block}
#report .top{background:var(--red);color:#fff;padding:10px 14px 8px}
#report .top strong{display:block;font-size:20px;font-weight:900;line-height:1.1}
#report .top span{font-size:14px;font-weight:600}
#report .real{padding:10px 14px 2px;font-size:15px;line-height:1.4}
#report .real b{display:block;font-size:12px;font-weight:800;color:#6b6a64;margin-bottom:2px}
#report .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 14px 12px}
#report .foot small{font-size:12px;color:#6b6a64;line-height:1.3}

#tour{position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(460px,calc(100% - 20px));
  background:var(--paper);color:var(--ink);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);padding:12px 14px;display:none}
#tour.show{display:block}
#tour .close{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;border:0;background:#e9e3d4;color:#15171a;font-size:18px;font-weight:900;cursor:pointer;line-height:1}
#tour h2{padding-right:36px;margin:0 0 4px;font-size:20px;font-weight:900;line-height:1.1}
#tour p{margin:0 0 8px;font-size:15px;line-height:1.4}
#tour .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;font-weight:800;color:#44433f;margin-bottom:8px}
#tour .legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
#tour .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
#tour .step{font-size:12px;font-weight:800;color:#6b6a64}
#tour .row .btns{display:flex;gap:8px}
#tour .btn{padding:8px 14px 6px;font-size:14px}
#zoom{position:absolute;top:12px;right:12px;display:none;flex-direction:column;gap:8px}
#zoom.show{display:flex}
#zoom button{width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:#15171a;font-size:22px;font-weight:900;box-shadow:0 2px 10px rgba(0,0,0,.25);cursor:pointer}
#dotCard{position:absolute;display:none;background:#15171a;color:#fff;border-radius:10px;padding:8px 12px 7px;font-size:13px;line-height:1.35;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:220px}
#dotCard b{display:block;font-size:15px;font-weight:900}
#dotCard i{font-style:normal;display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,12,12,.35);overflow:auto}
#overlay.hidden{display:none}
.card{width:min(400px,100%);background:var(--paper);color:var(--ink);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);overflow:hidden;margin:auto}
.plate{background:var(--sign);color:#fff;padding:12px 14px 10px;border:3px solid #fff;border-radius:9px;margin:9px 9px 0;box-shadow:0 0 0 2px var(--sign)}
.plate h1{margin:0;font-weight:900;font-size:clamp(32px,9vw,46px);line-height:.9;text-transform:uppercase}
.plate.red{background:var(--red);box-shadow:0 0 0 2px var(--red)}
.body{padding:12px 16px 16px}
.body p{margin:6px 0;line-height:1.45;font-size:15px}
.body .fine{font-size:12px;color:#5b5a55;line-height:1.4}
.btn{font-weight:900;font-size:15px;background:var(--yellow);color:#111;border:3px solid #111;border-radius:8px;padding:10px 16px 8px;cursor:pointer;box-shadow:0 3px 0 #111}
.btn.ghost{background:transparent}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #111}
.actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" aria-label="Top-down view of Broadway traffic"></canvas>
  <div id="hud" class="hidden">
    <div class="pill"><span id="levelName">Cornelia</span><span class="dots" id="lives"></span></div>
    <button id="pauseBtn" aria-label="Pause">II</button>
  </div>
  <div id="report" role="alertdialog" aria-live="assertive">
    <div class="top"><strong id="rTitle"></strong><span id="rSub"></span></div>
    <div class="real"><b id="rWhen"></b><span id="rText"></span></div>
    <div class="foot"><small id="rCount"></small><button class="btn" id="rBtn">Keep walking</button></div>
  </div>
  <div id="zoom"><button id="zIn" aria-label="Zoom in">+</button><button id="zOut" aria-label="Zoom out">&minus;</button></div>
  <div id="dotCard" role="status"></div>
  <div id="tour" role="dialog" aria-live="polite">
    <button class="close" id="tClose" aria-label="Close the tour">&times;</button>
    <h2 id="tTitle"></h2><p id="tText"></p>
    <div class="legend" id="tLegend"><span><i style="background:#e8412f"></i>Pedestrian hit</span><span><i style="background:#2f86d6"></i>Cyclist hit</span><span><i style="background:#a8a397"></i>Other crash</span></div>
    <div class="row"><span class="step" id="tStep"></span><span class="btns"><button class="btn ghost" id="tBack">Back</button><button class="btn" id="tNext">Next</button></span></div>
  </div>
  <div id="overlay"><div class="card" id="card"></div></div>
</div>

var asphalt=null,grain=null;

  asphalt=ctx.createPattern(c,'repeat');

  for(i=0;i<500;i++){g2.fillStyle=Math.random()<.5?'rgba(0,0,0,'+rnd(.03,.09)+')':'rgba(255,255,255,'+rnd(.03,.08)+')';g2.fillRect(Math.random()*64,Math.random()*64,rnd(1,2.5),rnd(1,2.5))}

function rect(x,y,w,h,f){ctx.fillStyle=f;ctx.fillRect(x,y,w,h)}
function text(t,x,y,size,color,align,weight){ctx.font=(weight||800)+' '+size+'px Overpass, Arial, sans-serif';ctx.fillStyle=color;ctx.textAlign=align||'left';ctx.textBaseline='middle';ctx.fillText(t,x,y)}
function rrect(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else{ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}}
function poly(pts,dx,dy){ctx.beginPath();ctx.moveTo(pts[0][0]+(dx||0),pts[0][1]+(dy||0));for(var i=1;i<pts.length;i++)ctx.lineTo(pts[i][0]+(dx||0),pts[i][1]+(dy||0));ctx.closePath()}
function stroke(pts,w,col){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='butt';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(var i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.stroke()}
function wrapLines(t,maxw,size,weight){
  ctx.font=weight+' '+size+'px Overpass, Arial, sans-serif';var words=t.split(' '),line='',lines=[];
  words.forEach(function(w){var test=line?line+' '+w:w;if(ctx.measureText(test).width>maxw&&line){lines.push(line);line=w}else line=test});
  if(line)lines.push(line);return lines;
}
function wrapText(t,x,y,maxw,size,col){
  var lines=wrapLines(t,maxw,size,col?800:600);
  lines.forEach(function(l,i){text(l,x,y+i*(size+7),size,col||'rgba(255,255,255,.85)','center',col?800:600)});
  return lines.length*(size+7);
}
function drawFadeCard(){

  var ql=wrapLines(q,mw,16,600),il=ins?wrapLines(ins,mw-28,15,800):[];
  var titleH=40,gap=18,qh=ql.length*23,ih=il.length?il.length*22+20:0;

  text('LEVEL '+num+' OF 8',SW/2,y-14,13,'rgba(255,255,255,.6)','center',800);

  ql.forEach(function(l,i){text(l,SW/2,y+11+i*23,16,'rgba(255,255,255,.82)','center',600)});y+=qh;
  if(ih){
    y+=qh?gap:0;ctx.font='800 15px Overpass, Arial, sans-serif';var bw=Math.min(mw+8,Math.max.apply(0,il.map(function(l){return ctx.measureText(l).width}))+48);
    rrect(SW/2-bw/2,y,bw,ih,12);ctx.fillStyle='rgba(255,210,63,.14)';ctx.fill();

function vis(y0,y1){return y1>cameraY-60&&y0<cameraY+VH+60}

function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,SW,SH);
  ctx.save();
  if(shake>0&&!reduceMotion)ctx.translate(rnd(-1,1)*shake*10,rnd(-1,1)*shake*10);
  ctx.translate(OX,0);ctx.scale(SC,SC);ctx.translate(0,-cameraY);
  drawWorld();
  ctx.restore();

    ctx.fillStyle='rgba(18,19,20,'+fade+')';ctx.fillRect(0,0,SW,SH);
    if(fadeName)drawFadeCard();

}

  GEO.alley.forEach(function(a){stroke(a[0],a[1]*PXM,'#8a8984')});
  GEO.lot.forEach(function(l){poly(l);ctx.fillStyle='#8f8e89';ctx.fill()});

  rect(118,y0,64,y1-y0,'#cfcbc1');rect(378,y0,64,y1-y0,'#cfcbc1');

  ctx.strokeStyle='#e2bf3c';ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(277.6,y0);ctx.lineTo(277.6,y1);ctx.moveTo(282.4,y0);ctx.lineTo(282.4,y1);ctx.stroke();

function drawMarkings(){
  // crosswalks across Broadway
  CROSS.forEach(function(c){
    if(!vis(c[0]-30,c[0]+30))return;
    var y=c[0];
    if(c[1]==='zebra'||c[1]==='yes')for(var x=RL+5;x<RR-8;x+=19)rect(x,y-18,10,36,'rgba(246,246,240,.9)');
    else if(c[1]==='lines'){rect(RL,y-19,RR-RL,3,'rgba(246,246,240,.85)');rect(RL,y+16,RR-RL,3,'rgba(246,246,240,.85)')}
  });
  // crosswalks across the side streets at the sidewalk
  MOUTHS.forEach(function(m){
    if(!vis(m.y-m.hw,m.y+m.hw))return;
    var xa=m.s==='W'?124:384;
    for(var k=m.curb[1]-m.hw+6;k<m.curb[1]+m.hw-8;k+=13)rect(xa,k,52,7,'rgba(246,246,240,.7)');
    // direction arrows on one-ways
    if(m.d!=='two')m.arrows.forEach(function(a){arrow(a[0],a[1],a[2])});
    else stroke(m.p,2,'#e2bf3c');
  });
  // stop bars on Broadway
  LEVELS.forEach(function(L){
    if(L.ctrl==='none')return;
    rect(RL+34,L.sb-2,280-RL-34,4,'rgba(246,246,240,.85)');rect(280,L.nb-2,RR-34-280,4,'rgba(246,246,240,.85)');
  });
}

  rect(B.x1,B.y0,3,(E?E.curb[1]+30:B.y1)-B.y0,'rgba(246,246,240,.85)');

    var cx=(B.x0+B.x1)/2;ctx.strokeStyle='rgba(246,246,240,.9)';ctx.lineWidth=1.6;

function drawBuildings(){
  var list=BLD.filter(function(b){return vis(b.y0-40,b.y1)});
  ctx.fillStyle='rgba(20,22,25,.28)';
  list.forEach(function(b){var o=b.lv;poly(b.pts,-o*2.2,-o*3.4);ctx.fill()});
  list.forEach(function(b){
    poly(b.pts);ctx.fillStyle=b.col;ctx.fill();
    if(grain){ctx.fillStyle=grain;ctx.fill()}
    if(b.seams){ctx.save();poly(b.pts);ctx.clip();ctx.strokeStyle='rgba(0,0,0,.045)';ctx.lineWidth=1;ctx.beginPath();
      for(var sx=b.x0+b.seams;sx<b.x1;sx+=b.seams){ctx.moveTo(sx,b.y0);ctx.lineTo(sx,b.y1)}ctx.stroke();ctx.restore()}
    ctx.strokeStyle='rgba(0,0,0,.28)';ctx.lineWidth=2;ctx.stroke();
    ctx.save();poly(b.pts);ctx.clip();ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=5;poly(b.pts);ctx.stroke();ctx.restore();
    b.units.forEach(function(u){
      if(u[4]==='deck'){rect(u[0],u[1],u[2]*1.6,u[3]*1.4,'#9a7a58');
        var cs=['#ff5a4f','#ffd23f','#5fd0ff','#9dff7a'];for(var q=0;q<6;q++){ctx.fillStyle=cs[q%4];ctx.beginPath();ctx.arc(u[0]+q*u[2]*1.6/5,u[1]+2,1.6,0,Math.PI*2);ctx.fill()}
        rect(u[0]+u[2]*.5,u[1]+u[3]*.5,6,6,'#3b3b3b');return}
      rect(u[0]+2,u[1]+2,u[2],u[3],'rgba(0,0,0,.25)');rect(u[0],u[1],u[2],u[3],'#ecebe6');rect(u[0]+2,u[1]+2,u[2]-4,3,'#c9c8c2');
    });
  });
  GEO.pool.forEach(function(pl){poly(pl);ctx.fillStyle='#6cc3d8';ctx.fill();ctx.strokeStyle='#f0f0ea';ctx.lineWidth=3;ctx.stroke()});
  list.forEach(function(b){if(!b.name)return;poly(b.pts);ctx.strokeStyle='#ffd23f';ctx.lineWidth=4;ctx.stroke()});

}

function landmarkLabel(b){
  var west=b.x1<280,viewL=-OX/SC+8,viewR=(SW-OX)/SC-8;
  var y=clamp(clamp(cameraY+VH*.3,b.y0+18,b.y1-18),cameraY+50,cameraY+VH-50),cw=cur().cw;
  if(mode!=='title'&&Math.abs(y-cw)<90){var alt=y<cw?cw-90:cw+90;if(alt>b.y0+10&&alt<b.y1-10)y=alt}
  var name=b.name,size=15;
  ctx.font='900 '+size+'px Overpass, Arial, sans-serif';
  var room=west?(RL-4)-viewL:viewR-(RR+4);
  if(ctx.measureText(name).width+36>room&&name.length>20)name=name.replace('Broadway United Methodist Church','Broadway UMC');
  while(ctx.measureText(name).width+36>room&&size>10){size--;ctx.font='900 '+size+'px Overpass, Arial, sans-serif'}
  var w=ctx.measureText(name).width+36;
  var lx=west?clamp(Math.min(b.x1-14,RL-60)-w,viewL,RL-4-w):clamp(Math.max(b.x0+14,RR+60),RR+4,viewR-w);
  ctx.save();ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=8;ctx.shadowOffsetY=2;
  rrect(lx,y-14,w,28,14);ctx.fillStyle='#fff';ctx.fill();ctx.restore();
  ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(lx+15,y,7,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#15171a';ctx.lineWidth=1.5;ctx.stroke();
  text(name,lx+27,y+1,size,'#15171a','left',900);
}
var SCHOOL=null;

function drawParked(){parked.forEach(function(p){if(vis(p.y-50,p.y+50))car(p.x,p.y,p.w,p.h,p.color,p.van?'delivery':'car',p.side==='W'?Math.PI:0,false,null,true)})}
function drawTrees(){
  trees.forEach(function(t){
    if(!vis(t.y-t.r,t.y+t.r))return;
    ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.arc(t.x-t.r*.25,t.y-t.r*.35,t.r,0,Math.PI*2);ctx.fill();
    var near=mode==='play'&&Math.hypot(t.x-player.x,t.y-player.y)<t.r+8;
    ctx.globalAlpha=near?.55:1;
    ctx.fillStyle=t.s>.5?'#56783f':'#617f42';ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.08)';ctx.beginPath();ctx.arc(t.x+t.r*.25,t.y+t.r*.2,t.r*.55,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  });
}
function drawTraffic(){
  vehicles.forEach(function(v){
    if(!vis(v.y-100,v.y+100))return;
    if(v.driveway&&v.x+v.h/2<90){
      var k=clamp(1-(90-(v.x+v.h/2))/90,0,1);
      if(k>0){var g=ctx.createRadialGradient(BL+4,v.y,2,BL+4,v.y,44);g.addColorStop(0,'rgba(255,240,170,'+(.75*k)+')');g.addColorStop(1,'rgba(255,240,170,0)');ctx.fillStyle=g;ctx.fillRect(BL-40,v.y-46,90,92)}
      return;
    }
    var m=v.v/MPH;
    if(m>33&&!reduceMotion&&v.mode==='lane'){
      var len=(m-30)*3.2,d=LANE[v.lane].dir;ctx.strokeStyle='rgba(255,255,255,'+Math.min(.35,(m-33)*.03)+')';ctx.lineWidth=2;ctx.beginPath();
      for(var k=-1;k<=1;k++){var sx=v.x+k*v.w*.3,sy=v.y-d*(v.h/2+4);ctx.moveTo(sx,sy);ctx.lineTo(sx,sy-d*len*(k?.7:1))}ctx.stroke();
    }
    if(v.kind==='micro')rider(v.x,v.y,v.color,v.rot,v.type);
    else car(v.x,v.y,v.w,v.h,v.color,v.type,v.rot,v.brake,Math.floor(worldTime*3)%2===0?(v.hazard?'H':v.blink):null,false);
  });
}
function upright(rot,fn){if(Math.cos(rot)>=0){fn();return}ctx.save();ctx.rotate(Math.PI);fn();ctx.restore()}
function car(cx,cy,w,h,color,type,rot,brake,blink,isParked){
  ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);
  ctx.fillStyle='rgba(0,0,0,.28)';rrect(-w/2-2,-h/2-3,w,h,8);ctx.fill();
  ctx.fillStyle=color;rrect(-w/2,-h/2,w,h,type==='bus'?6:9);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=1.5;ctx.stroke();
  if(type==='bus'){rect(-w/2+4,-h/2+6,w-8,14,'#6d93a6');rect(-w/2+5,-h/2+26,w-10,h-40,'#dcd6c9');rect(-w/2+3,-9,w-6,18,'#2f78ad');upright(rot,function(){text('36',0,1,13,'#fff','center',900)})}
  else if(type==='delivery'){rect(-w/2+5,-h/2+7,w-10,13,'#6d93a6');rect(-w/2+3,-h/2+24,w-6,h-30,'rgba(0,0,0,.08)')}
  else if(type==='pickup'){rect(-w/2+5,-h/2+10,w-10,14,'#6d93a6');rect(-w/2+5,-h/2+26,w-10,12,'rgba(0,0,0,.25)');rect(-w/2+5,-h/2+42,w-10,h-48,'rgba(0,0,0,.35)')}
  else{rect(-w/2+6,-h/2+10,w-12,15,'#6d93a6');rect(-w/2+6,-h/2+10,w-12,4,'rgba(255,255,255,.25)');rect(-w/2+6,h/2-21,w-12,12,'#5d8292');if(type==='cab'){rect(-10,-4,20,9,'#111');upright(rot,function(){text('TAXI',0,1,6.5,'#ffd23f','center',900)})}}
  rect(-w/2+4,-h/2+1,8,4,isParked?'#d8cf9f':'#fff3b8');rect(w/2-12,-h/2+1,8,4,isParked?'#d8cf9f':'#fff3b8');
  rect(-w/2+4,h/2-5,8,4,brake?'#ff2d1a':'#8e2020');rect(w/2-12,h/2-5,8,4,brake?'#ff2d1a':'#8e2020');
  if(blink){(blink==='H'?[1,-1]:[blink==='R'?1:-1]).forEach(function(sd){var bx=sd===1?w/2-6:-w/2-1;rect(bx,-h/2+1,7,6,'#ffb627');rect(bx,h/2-7,7,6,'#ffb627')})}

}
function rider(cx,cy,color,rot,type){
  ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(-2,-3,6,type==='scooter'?12:14,0,0,Math.PI*2);ctx.fill();
  var o=type==='scooter'?9:10;
  ctx.strokeStyle='#161616';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,-o-4);ctx.lineTo(0,-o+4);ctx.moveTo(0,o-4);ctx.lineTo(0,o+4);ctx.stroke();
  ctx.strokeStyle=color;ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(0,-o+2);ctx.lineTo(0,o-2);ctx.stroke();
  ctx.strokeStyle='#161616';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-6,-o+2);ctx.lineTo(6,-o+2);ctx.stroke();
  ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(0,1,6,5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#f2f2f2';ctx.beginPath();ctx.arc(0,-2,3.8,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawPlayer(){
  if(mode==='title')return;
  if(inv>0&&mode==='play'&&Math.floor(inv*12)%2===0)return;
  var sc=1.3,x=player.x,y=player.y;
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(-3,-4,13,10,0,0,Math.PI*2);ctx.fill();
  ctx.scale(sc,sc);ctx.rotate(player.ang===undefined?Math.PI/2:player.ang);
  var sw=Math.sin((player.walk||0)*.32)*4;
  ctx.fillStyle='#15171a';rrect(-11,-5+sw,6,11,3);ctx.fill();rrect(5,-5-sw,6,11,3);ctx.fill();
  ctx.fillStyle='#fff';rrect(-10,-8,20,15,6);ctx.fill();
  ctx.fillStyle='#ffd23f';rrect(-8.5,-6.5,17,12,5);ctx.fill();
  ctx.fillStyle='#3b2a20';ctx.beginPath();ctx.arc(0,0,5.6,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawPigeons(){
  pigeons.forEach(function(g){
    var s=g.fly?1+g.fly*.8:1;ctx.save();ctx.translate(g.x,g.y);ctx.rotate(g.fly?Math.atan2(g.vy,g.vx)+Math.PI/2:g.a);ctx.scale(s,s);
    ctx.globalAlpha=g.fly?Math.max(0,1-g.fly/1.6):1;
    if(g.fly){var fl=Math.sin(g.fly*40)*5;ctx.strokeStyle='#8d9096';ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(-9,fl);ctx.lineTo(0,0);ctx.lineTo(9,fl);ctx.stroke()}
    ctx.fillStyle='#8d9096';ctx.beginPath();ctx.ellipse(0,0,3.4,5.5,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#5b6570';ctx.beginPath();ctx.arc(0,-5,2.4,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });
}
function drawMirror(){
  if(!vis(DRIVE_Y-60,DRIVE_Y+120))return;
  var mx=BL+8,my=DRIVE_Y+52,r=17;
  rect(mx-1.5,my-24,3,24,'#6b6e72');
  ctx.save();ctx.beginPath();ctx.arc(mx,my,r,0,Math.PI*2);ctx.fillStyle='#2b2f33';ctx.fill();
  var g=ctx.createRadialGradient(mx-5,my-6,2,mx,my,r);g.addColorStop(0,'#e9eef2');g.addColorStop(1,'#9aa6b0');
  ctx.beginPath();ctx.arc(mx,my,r-3,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.clip();
  // the reflection: whatever is coming down the alley
  vehicles.forEach(function(v){
    if(!v.driveway||v.x+v.h/2>=90)return;
    var t=clamp((v.x+260)/350,0,1),cx=mx-12+t*20,sz=4+t*7;
    ctx.fillStyle=v.color;rrect(cx-sz,my-sz*.6,sz*2,sz*1.2,2);ctx.fill();
    ctx.fillStyle='#fff3b8';ctx.fillRect(cx+sz-2,my-sz*.5,2,2);ctx.fillRect(cx+sz-2,my+sz*.5-2,2,2);
  });
  ctx.restore();
  ctx.beginPath();ctx.arc(mx,my,r,0,Math.PI*2);ctx.strokeStyle='#ff8a1a';ctx.lineWidth=3;ctx.stroke();
}
// Crossing guard at the Nettelhorst crosswalk during school rush
var guard={x:RL-20,y:7634+30};
function guardOn(){return level===5&&mode==='play'&&playerInCrosswalk()===7634}
function drawGuard(){
  if(level!==5||mode==='title'||!vis(7550,7720))return;
  var on=guardOn(),tx=on?RL+40:RL-20,ty=on?7634-8:7634+30;
  guard.x+=(tx-guard.x)*.12;guard.y+=(ty-guard.y)*.12;
  person(guard.x,guard.y,'#c8ff3c',on?Math.PI/2:0,worldTime*6*(on?1:0),1.15);
  ctx.save();ctx.translate(guard.x+(on?16:12),guard.y-12);ctx.fillStyle='#c8291f';ctx.beginPath();
  for(var k=0;k<8;k++){var a=Math.PI/8+k*Math.PI/4;ctx.lineTo(Math.cos(a)*10,Math.sin(a)*10)}
  ctx.closePath();ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.2;ctx.stroke();ctx.restore();
}
function person(x,y,coat,ang,step,scale){
  ctx.save();ctx.translate(x,y);ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(-2,-3,9*scale,6*scale,0,0,Math.PI*2);ctx.fill();
  ctx.scale(scale,scale);ctx.rotate(ang);var sw=Math.sin(step)*4;
  ctx.fillStyle='#15171a';rrect(-8,-4+sw,4,8,2);ctx.fill();rrect(4,-4-sw,4,8,2);ctx.fill();
  ctx.fillStyle=coat;rrect(-7,-5,14,10,4);ctx.fill();ctx.fillStyle='#4a3325';ctx.beginPath();ctx.arc(0,0,4.6,0,Math.PI*2);ctx.fill();ctx.restore();
}
function drawHint(){
  if(mode!=='play'||transitioning||idleT<1.2)return;
  var r=cur().route,t=r[wp];if(!t)return;
  var a=Math.atan2(t[1]-player.y,t[0]-player.x),pulse=reduceMotion?0:Math.sin(worldTime*4)*4,dist=30+pulse;
  ctx.save();ctx.translate(player.x+Math.cos(a)*dist,player.y+Math.sin(a)*dist);ctx.rotate(a);
  ctx.globalAlpha=Math.min(1,(idleT-1.2)*2)*.9;ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(-5,-8);ctx.lineTo(4,0);ctx.lineTo(-5,8);ctx.stroke();ctx.restore();
}
function drawGuide(){
  if(mode!=='play')return;
  var r=cur().route,pts=[[player.x,player.y]].concat(r.slice(wp));
  if(pts.length<2)return;
  ctx.save();ctx.setLineDash([10,9]);ctx.lineDashOffset=-worldTime*30;ctx.lineCap='round';
  ctx.strokeStyle='rgba(255,210,63,.95)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(var i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.stroke();ctx.restore();
  var t=r[wp],pl=reduceMotion?0:Math.sin(worldTime*5)*3,last=wp===r.length-1;
  ctx.beginPath();ctx.arc(t[0],t[1],14+pl,0,Math.PI*2);ctx.strokeStyle='#ffd23f';ctx.lineWidth=3;ctx.stroke();
  ctx.beginPath();ctx.arc(t[0],t[1],5,0,Math.PI*2);ctx.fillStyle=last?'#ffd23f':'#fff';ctx.fill();
}
function drawImpacts(){impacts.forEach(function(m){var a=Math.min(1,m.t);ctx.strokeStyle='rgba(217,65,47,'+a+')';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(m.x-9,m.y-9);ctx.lineTo(m.x+9,m.y+9);ctx.moveTo(m.x+9,m.y-9);ctx.lineTo(m.x-9,m.y+9);ctx.stroke()})}

// Walk signals, traffic lights, stop signs and speed signs at the crossing you're on
function drawControls(){
  LEVELS.forEach(function(L,i){
    if(!vis(L.sb?L.sb-80:L.cw-80,(L.nb||L.cw)+80))return;
    if(L.ctrl==='signal'){
      var ph=sig(L);
      (L.cws||[L.cw]).forEach(function(c){var below=c>=L.cw;pedHead(RL-30,below?c+26:c-48,ph);pedHead(RR+8,below?c+26:c-48,ph)});
      lightHead(RL-16,L.sb-34,ph.bw);lightHead(RR+6,L.nb+10,ph.bw);
    }else if(L.ctrl==='stop'){
      stopSign(RL-14,L.sb-12);stopSign(RR+14,L.nb+12);
    }
  });
  MOUTHS.forEach(function(m){
    if((m.d==='in'||m.d==='two')&&!m.sig&&vis(m.y-80,m.y+80)){
      stopSign(m.s==='W'?RL-60:RR+60,m.curb[1]+(m.s==='W'?1:-1)*(m.hw+10));
    }
  });
}
function stopSign(x,y){
  ctx.save();ctx.translate(x,y);ctx.fillStyle='#c8291f';ctx.beginPath();
  for(var k=0;k<8;k++){var a=Math.PI/8+k*Math.PI/4;ctx.lineTo(Math.cos(a)*9,Math.sin(a)*9)}
  ctx.closePath();ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.2;ctx.stroke();ctx.restore();
}
function pedHead(x,y,ph){
  var s=22;rrect(x,y,s,s,3);ctx.fillStyle='#111';ctx.fill();
  var show=ph.ped!=='FDW'||Math.floor(worldTime*2)%2===0;
  if(show){
    if(ph.ped==='W'){
      ctx.fillStyle='#f2f2f2';ctx.beginPath();ctx.arc(x+s/2,y+s*.25,s*.1,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#f2f2f2';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+s/2,y+s*.36);ctx.lineTo(x+s/2,y+s*.62);ctx.moveTo(x+s/2,y+s*.62);ctx.lineTo(x+s*.36,y+s*.85);ctx.moveTo(x+s/2,y+s*.62);ctx.lineTo(x+s*.64,y+s*.85);ctx.moveTo(x+s*.34,y+s*.48);ctx.lineTo(x+s*.66,y+s*.44);ctx.stroke();
    }else{ctx.fillStyle='#ff7a1a';rrect(x+s*.3,y+s*.3,s*.4,s*.45,2);ctx.fill();for(var f=0;f<4;f++)rect(x+s*.3+f*s*.1,y+s*.16,s*.07,s*.2,'#ff7a1a')}
  }
  if(ph.ped==='FDW'){rrect(x,y+s+2,s,s*.8,3);ctx.fillStyle='#111';ctx.fill();text(String(ph.cd),x+s/2,y+s+2+s*.42,13,'#ff7a1a','center',900)}
}
function lightHead(x,y,st){rrect(x,y,10,26,3);ctx.fillStyle='#111';ctx.fill();[['R','#ff3b2f',4],['Y','#ffc02e',13],['G','#35d06b',22]].forEach(function(c){ctx.fillStyle=st===c[0]?c[1]:'#333';ctx.beginPath();ctx.arc(x+5,y+c[2],3,0,Math.PI*2);ctx.fill()})}
function nextCar(key,L){var ln=LANE[key],best=null,bd=1e9;vehicles.forEach(function(v){if(v.mode!=='lane'||v.lane!==key)return;var d=(L.cw-v.y)*ln.dir-v.h/2;if(d>-10&&d<600&&d<bd){bd=d;best=v}});return best}
function radarSign(x,y,v){
  var m=v?mphOf(v):null,fast=m!==null&&m>30,blink=fast&&!reduceMotion&&Math.floor(worldTime*4)%2===0;
  rrect(x,y,36,36,4);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#111';ctx.lineWidth=2;ctx.stroke();
  text('LIMIT 30',x+18,y+7,6.5,'#111','center',900);rect(x+3,y+13,30,20,'#101010');
  if(!blink)text(m===null?'--':m>=42?'BRO':String(m),x+18,y+24,m>=42?11:14,fast?'#ff4a36':'#ffb627','center',900);
}

/* ================= loop ================= */

function resize(){
  var r=canvas.getBoundingClientRect();DPR=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.max(1,Math.floor(r.width*DPR));canvas.height=Math.max(1,Math.floor(r.height*DPR));
  SW=r.width;SH=r.height;SC=Math.min(SW/500,SH/880);VW=SW/SC;VH=SH/SC;OX=SW/2-280*SC;
  cameraTarget=viewTargetFor(level);if(mode!=='play')cameraY=cameraTarget;
}
var last=0;
function frame(t){
  var dt=Math.min(.033,(t-last)/1000||0);last=t;
  if(fadeHold>0){fadeHold-=dt;if(fadeHold<=0)fadeDir=-1}
  if(fadeDir){
    fade=clamp(fade+fadeDir*dt*1.8,0,1);
    if(fadeDir===1&&fade>=1){if(fadeName!==cur().name)goToLevel(level+1);fadeDir=0;fadeHold=1.9}
    else if(fadeDir===-1&&fade<=0){fadeDir=0;transitioning=false;fadeName=''}
  }
  walkUpdate(dt);
  hud.style.opacity=String(1-fade);
  if(mode==='play'||mode==='title'||mode==='over'){worldTime+=dt;updateTraffic(dt);checkPlayer();inv=Math.max(0,inv-dt)}
  taps.forEach(function(t){t.t-=dt});taps=taps.filter(function(t){return t.t>0});
  shake=Math.max(0,shake-dt*1.6);flash=Math.max(0,flash-dt*1.4);player.hop=Math.max(0,player.hop-dt*9);
  for(var i=impacts.length-1;i>=0;i--){impacts[i].t-=dt;if(impacts[i].t<=0)impacts.splice(i,1)}
  pigeons.forEach(function(g){
    if(!g.fly){
      var th=null;
      if(mode==='play'&&Math.hypot(g.x-player.x,g.y-player.y)<52)th=player;
      else for(var q=0;q<vehicles.length;q++){var vv=vehicles[q];if(Math.abs(vv.x-g.x)<60&&Math.abs(vv.y-g.y)<70){th=vv;break}}
      if(th){g.fly=.01;var a=Math.atan2(g.y-th.y,g.x-th.x)+rnd(-.5,.5),sp=rnd(170,240);g.vx=Math.cos(a)*sp+(g.x<280?-90:90);g.vy=Math.sin(a)*sp}
    }
    if(g.fly){g.fly+=dt;g.x+=g.vx*dt;g.y+=g.vy*dt}else if(Math.random()<dt*.8)g.a+=rnd(-1,1);
  });
  pigeons=pigeons.filter(function(g){return g.fly<1.6});
  cameraY+=(cameraTarget-cameraY)*Math.min(1,dt*6);
  if(mode==='tour'&&tour)tourCamera(dt);
  draw();requestAnimationFrame(frame);
}

/* ================= input ================= */

window.addEventListener('keydown',function(e){
  var k=e.key.toLowerCase();
  if(['arrowleft','arrowright','arrowup','arrowdown',' '].indexOf(k)>=0)e.preventDefault();
  if(k==='m'){ensureAudio();setMuted(!muted);return}
  if((k==='p'||k==='escape')&&mode!=='tour'){setPaused(mode==='play'||mode==='hit');return}
  if(mode==='title'&&(k==='enter'||k===' ')){startGame();return}
  if(mode==='hit'&&(k==='enter'||k===' ')){dismissReport();return}
  if(mode==='tour'){if(k==='arrowright'||k==='enter'||k===' ')$('tNext').click();else if(k==='arrowleft')$('tBack').click();else if(k==='escape')closeTour();else if(k==='+'||k==='=')$('zIn').click();else if(k==='-')$('zOut').click();return}
  if(mode!=='play')return;
  var kd=KEYDIR[k];if(kd&&keysDown.indexOf(kd)<0)keysDown.push(kd);
});
var KEYDIR={arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0],arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1]};
window.addEventListener('keyup',function(e){var kd=KEYDIR[e.key.toLowerCase()];if(kd)keysDown=keysDown.filter(function(x){return x!==kd})});
window.addEventListener('blur',function(){keysDown=[];held=null});
var taps=[],sx=0,sy=0,sdown=false,ptrs={},pinch=null,dragged=false;
var touchT=0,touchMoved=0;
canvas.addEventListener('pointerdown',function(e){
  sx=e.clientX;sy=e.clientY;sdown=true;ensureAudio();
  if(mode==='play'){
    var r=canvas.getBoundingClientRect();touchT=performance.now();touchMoved=player.s||0;
    var ty=e.clientY-r.top,py=(player.y-cameraY)*SC;
    held=railAxis()==='v'?(ty<py?[0,-1]:[0,1]):((e.clientX-r.left)<r.width/2?[-1,0]:[1,0]);
    taps.push({x:(e.clientX-r.left-OX)/SC,y:(e.clientY-r.top)/SC+cameraY,t:.35});
    try{canvas.setPointerCapture(e.pointerId)}catch(_){}
  }
  if(mode==='tour'){ptrs[e.pointerId]={x:e.clientX,y:e.clientY};dragged=false;try{canvas.setPointerCapture(e.pointerId)}catch(_){}
    var ids=Object.keys(ptrs);if(ids.length===2){var a=ptrs[ids[0]],b=ptrs[ids[1]];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)}}}
});
canvas.addEventListener('pointermove',function(e){
  if(mode==='play'&&sdown&&held){
    var mx=e.clientX-sx,my=e.clientY-sy;
    if(Math.abs(my)>18&&Math.abs(my)>Math.abs(mx))held=[0,my>0?1:-1];
    else if(Math.abs(mx)>18&&Math.abs(mx)>Math.abs(my))held=[mx>0?1:-1,0];
    return;
  }
  if(mode!=='tour'||!ptrs[e.pointerId])return;
  var p=ptrs[e.pointerId],dx=e.clientX-p.x,dy=e.clientY-p.y,r=canvas.getBoundingClientRect();
  p.x=e.clientX;p.y=e.clientY;
  var ids=Object.keys(ptrs);
  if(ids.length===2&&pinch){var a=ptrs[ids[0]],b=ptrs[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinch.d>0)zoomAt(d/pinch.d,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);pinch.d=d;dragged=true;return}
  if(Math.hypot(e.clientX-sx,e.clientY-sy)>8)dragged=true;
  if(dragged){tour.cx-=dx/tour.s;tour.cy-=dy/tour.s;tour.t={s:tour.s,cx:tour.cx,cy:tour.cy};tour.manual=true;hideDot()}
});
canvas.addEventListener('pointerup',function(e){
  if(mode==='tour'){
    delete ptrs[e.pointerId];if(Object.keys(ptrs).length<2)pinch=null;sdown=false;
    if(!dragged){var r=canvas.getBoundingClientRect(),d=pickDot(e.clientX-r.left,e.clientY-r.top);if(d)showDot(d,e.clientX,e.clientY);else hideDot()}
    return;
  }
  if(!sdown)return;sdown=false;
  if(mode==='hit'){held=null;dismissReport();return}
  if(mode==='play'&&held){
    // a quick tap or flick still gives you a full stride
    var quick=performance.now()-touchT<240,walked=Math.abs((player.s||0)-touchMoved);
    if(quick&&walked<40){pendDir=held;pend=40-walked}
    held=null;
  }
});
canvas.addEventListener('pointercancel',function(e){sdown=false;held=null;delete ptrs[e.pointerId];pinch=null});
$('rBtn').onclick=dismissReport;
$('tNext').onclick=function(){if(tour.step<TOUR.length-1)setTour(tour.step+1);else closeTour()};
$('tBack').onclick=function(){if(tour.step>0)setTour(tour.step-1)};
$('tClose').onclick=closeTour;
$('zIn').onclick=function(){zoomAt(1.5,SW/2,SH/2)};
$('zOut').onclick=function(){zoomAt(1/1.5,SW/2,SH/2)};
canvas.addEventListener('wheel',function(e){if(mode!=='tour')return;e.preventDefault();var r=canvas.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});
$('pauseBtn').onclick=function(){setPaused(mode==='play'||mode==='hit')};
document.addEventListener('visibilitychange',function(){if(document.hidden&&mode==='play')setPaused(true)});
window.addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe($('stage'));

/* ================= boot ================= */

makeAsphalt();prepBuildings();findSchool();makeParked();makeTrees();
resize();
goToLevel(0);
setMuted(muted);showTitle();
requestAnimationFrame(frame);
})();
</script>
